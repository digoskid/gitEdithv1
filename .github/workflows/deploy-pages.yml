name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject PayPhone web token
        env:
          PAYPHONE_TOKEN: ${{ secrets.PAYPHONE_TOKEN }}
        run: |
          test -n "$PAYPHONE_TOKEN"
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path("src/config.public.js")
          content = path.read_text()
          token = os.environ["PAYPHONE_TOKEN"].strip()
          path.write_text(content.replace("REEMPLAZA_CON_TOKEN_PUBLICO_PAYPHONE", token))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4