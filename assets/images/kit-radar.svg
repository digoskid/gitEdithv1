<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#F4EFDE"/>
  <!-- Circulos concentricos del radar -->
  <circle cx="200" cy="150" r="110" fill="none" stroke="#18364A" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="150" r="80" fill="none" stroke="#18364A" stroke-width="1.5" opacity="0.35"/>
  <circle cx="200" cy="150" r="55" fill="none" stroke="#18364A" stroke-width="2" opacity="0.55"/>
  <circle cx="200" cy="150" r="30" fill="none" stroke="#18364A" stroke-width="2.5" opacity="0.8"/>
  <!-- Brazo del radar -->
  <line x1="200" y1="150" x2="290" y2="75" stroke="#6A6EB2" stroke-width="3" stroke-linecap="round"/>
  <!-- Centro del radar -->
  <circle cx="200" cy="150" r="7" fill="#18364A"/>
  <!-- Pensamientos detectados (puntos amarillos en el radar) -->
  <circle cx="260" cy="100" r="6" fill="#E1E155"/>
  <circle cx="175" cy="100" r="4" fill="#E1E155" opacity="0.7"/>
  <circle cx="240" cy="170" r="5" fill="#E1E155" opacity="0.5"/>
  <circle cx="155" cy="175" r="3" fill="#E1E155" opacity="0.4"/>
  <!-- Lineas de cuadricula -->
  <line x1="200" y1="40" x2="200" y2="260" stroke="#18364A" stroke-width="0.75" opacity="0.15"/>
  <line x1="90" y1="150" x2="310" y2="150" stroke="#18364A" stroke-width="0.75" opacity="0.15"/>
  <!-- Label -->
  <text x="200" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#18364A" font-weight="600" letter-spacing="2">TU RADAR DE RUMIA</text>
</svg>
