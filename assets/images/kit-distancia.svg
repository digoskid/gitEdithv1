<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#F4EFDE"/>
  <!-- Persona observando pensamientos -->
  <ellipse cx="130" cy="200" rx="22" ry="22" fill="none" stroke="#18364A" stroke-width="2.5"/>
  <rect x="120" y="222" width="20" height="45" rx="4" fill="none" stroke="#18364A" stroke-width="2.5"/>
  <!-- Pensamientos flotantes a distancia -->
  <ellipse cx="300" cy="100" rx="60" ry="40" fill="none" stroke="#6A6EB2" stroke-width="2" stroke-dasharray="6 4"/>
  <ellipse cx="300" cy="100" rx="45" ry="28" fill="none" stroke="#6A6EB2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Linea de distancia / separacion -->
  <line x1="160" y1="190" x2="235" y2="130" stroke="#E1E155" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/>
  <!-- Puntos en la linea -->
  <circle cx="197" cy="160" r="4" fill="#E1E155"/>
  <!-- Pequeño punto de presencia en la persona -->
  <circle cx="155" cy="200" r="3" fill="#E1E155"/>
  <!-- Etiqueta sutl -->
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#18364A" font-weight="600" letter-spacing="2">DISTANCIA DE LOS PENSAMIENTOS</text>
</svg>
